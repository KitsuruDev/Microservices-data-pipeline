services:
  # -------------------- Kafka-брокер c Zookeeper --------------------
  # Мониторит, какие брокеры живы, кто является лидером для каждой партиции и т.д.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-network

  # Сохраняет сообщения на диске (по партициям) и раздаёт их всем заинтересованным потребителям
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-network

  # -------------------- Kafka Connect - Debezium (producer) --------------------
  # Читает изменения из PostgreSQL и отправляет их в определённый топик Kafka-брокер
  kafka-connect:
    image: debezium/connect:1.8
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      REST_ADVERTISED_HOST_NAME: kafka-connect
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      PLUGIN_NAME: wal2json
    volumes:
      - ./sinks/jars:/kafka/connect/sink-plugins
    ports:
      - "8083:8083"
    networks:
      - data-network

  # -------------------- Kafka UI --------------------
  # Визуальный мониторинг за состояниями брокера, потребителей и топиков
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8084:8080"
    networks:
      - data-network

  # -------------------- Генератор данных (только PostgreSQL) --------------------
  data-generator:
    build: ./generator
    container_name: generator
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-connect:
        condition: service_started
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: testdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PYTHONUNBUFFERED: 1
    networks:
      - data-network
  
  # -------------------- Базы данных --------------------
  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    command: redis-server --appendonly yes --logfile /var/log/redis/redis.log
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb-server
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_logs:/var/log/mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: testdb
    networks:
      - data-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  neo4j:
    image: neo4j:5-community
    container_name: neo4j-server
    restart: unless-stopped
    ports:
      - "10000:7474"
      - "10001:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: elasticsearch-server
    restart: unless-stopped
    ports:
      - "20000:9200"
      - "20001:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_logs:/usr/share/elasticsearch/logs
    environment:
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - discovery.type=single-node
      - ELASTIC_PASSWORD=elastic_pass123
      - cluster.routing.allocation.disk.watermark.low=90%
      - cluster.routing.allocation.disk.watermark.high=95%
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgresql:
    image: postgres:15-alpine
    container_name: postgresql-server
    restart: unless-stopped
    ports:
      - "5435:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - postgresql_logs:/var/log/postgresql
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: testdb
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres -c listen_addresses='*' -c log_directory='/var/log/postgresql' -c max_connections=200 -c wal_level=logical
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------- Инициализация коннекторов вспомогательных БД --------------------
  connect-setup:
    image: curlimages/curl:latest
    depends_on:
      kafka-connect:
        condition: service_started
      postgresql:
        condition: service_healthy
      data-generator:
        condition: service_completed_successfully
    volumes:
      - ./sinks/configs:/configs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka Connect REST API..."
        while ! curl -s -o /dev/null -w "%{http_code}" http://kafka-connect:8083/connectors | grep -q 200; do
          sleep 2
        done

        echo "Registering Debezium PostgreSQL connector..."
        curl -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d '{
            "name": "postgres-connector",
            "config": {
              "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
              "tasks.max": "1",
              "database.hostname": "postgresql",
              "database.port": "5432",
              "database.user": "admin",
              "database.password": "admin123",
              "database.dbname": "testdb",
              "topic.prefix": "dbserver",
              "plugin.name": "wal2json",
              "slot.name": "debezium",
              "publication.name": "pub",
              "table.include.list": "public.*",
              "snapshot.mode": "initial"
            }
          }'

        echo "Registering Redis Sink Connector..."
        curl -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d @/configs/redis-sink-config.json

        echo "Registering Elasticsearch Sink Connector..."
        curl -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d @/configs/elasticsearch-sink-config.json

        echo "Registering Neo4j Sink Connector..."
        curl -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d @/configs/neo4j-sink-config.json

        echo "Registering MongoDB Sink Connector..."
        curl -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d @/configs/mongodb-sink-config.json

        echo "Setup complete."
    networks:
      - data-network

  # -------------------- Генератор сертификатов --------------------
  # запускается один раз, генерирует сертификаты, вырубается, после чего сертификаты используются в других контейнерах
  cert-generator:
    image: ubuntu:22.04
    container_name: cert-generator
    volumes:
      - certs_data:/certs
      - ./scripts/generate-all-certs.sh:/generate-all-certs.sh:ro
    command: bash -c "apt-get update && apt-get install -y openssl && sh /generate-all-certs.sh"
    networks:
      - data-network

  # -------------------- API Gateway --------------------
  gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - certs_data:/certs:ro
    networks:
      - data-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      nginx:
        condition: service_started

  # -------------------- Lab Service --------------------
  # Nginx с mTLS
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/nginx/certs:ro
    networks:
      - data-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      lab1_service:
        condition: service_started
      lab2_service:
        condition: service_started
      lab3_service:
        condition: service_started

  lab1_service:
    build:
      context: .
      dockerfile: ./lab1_service/dockerfile
    container_name: lab1-service
    restart: unless-stopped
    expose:
      - "8001" # только внутренняя сеть
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=testdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=admin
      - MONGO_PASSWORD=admin123
      - MONGO_DB=testdb
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic_pass123
    networks:
      - data-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  lab2_service:
    build:
      context: .
      dockerfile: ./lab2_service/dockerfile
    container_name: lab2-service
    restart: unless-stopped
    expose:
      - "8002" # только внутренняя сеть
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=testdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=admin
      - MONGO_PASSWORD=admin123
      - MONGO_DB=testdb
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic_pass123
    networks:
      - data-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  lab3_service:
    build:
      context: .
      dockerfile: ./lab3_service/dockerfile
    container_name: lab3-service
    restart: unless-stopped
    expose:
      - "8003" # только внутренняя сеть
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=testdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=admin
      - MONGO_PASSWORD=admin123
      - MONGO_DB=testdb
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic_pass123
    networks:
      - data-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

networks:
  data-network:
    driver: bridge

volumes:
  certs_data:
    driver: local
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/redis
      o: bind
  redis_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/logs/redis
      o: bind
  mongodb_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/mongodb
      o: bind
  mongodb_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/logs/mongodb
      o: bind
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/neo4j/data
      o: bind
  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/neo4j/logs
      o: bind
  neo4j_import:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/neo4j/import
      o: bind
  neo4j_plugins:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/neo4j/plugins
      o: bind
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/elasticsearch/data
      o: bind
  elasticsearch_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/logs/elasticsearch
      o: bind
  postgresql_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/postgresql/data
      o: bind
  postgresql_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/Microservices-data-pipeline/logs/postgresql
      o: bind